
name: Deploy Mekangyi to AWS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm --prefix client ci
          npm --prefix admin ci

      - name: Build frontend
        run: |
          npm --prefix client run build
          npm --prefix admin run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::458201209340:role/github-actions-deploy-role
          aws-region: ap-northeast-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy shopping mall
        run: |
          aws s3 sync client/dist/ s3://web-shopbucket-l9wxjgj6eji1/

      - name: Deploy admin
        run: |
          aws s3 sync admin/dist/ s3://web-adminbucket-vu95pdf5l1xx/

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1GJFVWWPZ4AH9 \
            --paths "/*"

      - name: Show OIDC sub
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub, aud, repository}'
