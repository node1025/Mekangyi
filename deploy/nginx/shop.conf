server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/site;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /srv/site;
        internal;
        add_header Cache-Control "no-store" always;
    }
    location @upstream_json_error {
        internal;
        default_type application/json;
        return 502 '{"message":"일시적으로 서비스를 사용할 수 없습니다."}';
    }
    location ~ ^/admin(?:/|$) { return 404; }
    location ~ ^/api/(?:admin|orders/admin|review/admin)(?:/|$) { return 403; }
    location ~ ^/api/products(?:/|$) {
        limit_except GET { deny all; }
        include /etc/nginx/proxy.conf;
    }
    location ~ ^/api/(?:orders|review)(?:/|$) {
        limit_except GET POST { deny all; }
        include /etc/nginx/proxy.conf;
    }
    location ~ ^/api/(?:auth|cart|board)(?:/|$) { include /etc/nginx/proxy.conf; }
    location /api/ { return 403; }
    location /uploads/ {
        alias /srv/uploads/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600";
    }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location = /index.html { add_header Cache-Control no-cache; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
