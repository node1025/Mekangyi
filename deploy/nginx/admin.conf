# server_name은 admin·ops 같은 예측 쉬운 이름 대신
# ops-9f3c7a.internal.example.com 처럼 사내 전용·추측 어려운 호스트를 쓰세요.
# IP 허용은 admin-allowlist.conf 에 VPN/사무실 대역만 등록합니다.
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/admin-allowlist.conf;
    root /srv/site;
    index index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location /api/ { include /etc/nginx/proxy.conf; }
    location /uploads/ { alias /srv/uploads/; }
    location /assets/ { try_files $uri =404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
