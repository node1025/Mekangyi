<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>일시적으로 이용할 수 없습니다 · 부캉이 굿즈샵</title>
  <style>
    :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 20px;
    font-family: "Pretendard", "Malgun Gothic", sans-serif;
    background: #f4f8ff;
    color: #254e86;
  }
  main {
    max-width: 440px;
    text-align: center;
    background: #fff;
    border-radius: 20px;
    padding: 40px 28px;
    box-shadow: 0 12px 40px rgba(37, 78, 134, 0.08);
  }
  p.kicker {
    margin: 0 0 12px;
    font-size: 12px;
    letter-spacing: 1.4px;
    color: #52627a;
  }
  h1 {
    margin: 0 0 14px;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }
  p.lead {
    margin: 0 0 28px;
    font-size: 15px;
    line-height: 1.75;
    color: #52627a;
  }
  a {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 999px;
    background: #5890df;
    color: #fff;
    text-decoration: none;
    font-size: 15px;
  }
  </style>
</head>
<body>
  <main>
    <p class="kicker">503 · SERVICE UNAVAILABLE</p>
    <h1>잠시 연결할 수 없어요</h1>
    <p class="lead">
      서버 점검 중이거나 일시적인 오류일 수 있습니다. 잠시 후 다시 시도해 주세요.
    </p>
    <a href="/">홈으로 돌아가기</a>
  </main>
</body>
</html>
